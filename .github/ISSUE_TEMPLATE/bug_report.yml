name: 错误报告
description: 报告可以稳定复现的问题
title: "[错误] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请使用仓库的私密漏洞报告，不要在此公开。
  - type: input
    id: version
    attributes:
      label: Honey 版本
      description: 可在 Release 页面或 EXE 属性中查看。
      placeholder: v1.0.2
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: 下载版本
      options:
        - 自包含版（无须安装 .NET）
        - 轻量版（需要 .NET 10 Desktop Runtime）
        - 从源码构建
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2，系统内部版本 26100
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最短、稳定的复现过程。
      placeholder: |
        1. 启动 Honey
        2. 打开……
        3. 执行……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可粘贴已脱敏的日志，或拖入截图、录屏。请勿提交 API 密钥、个人路径和数据库。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我已移除日志和附件中的敏感信息。
          required: true
