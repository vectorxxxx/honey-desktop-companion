name: 功能建议
description: 提议一个清晰、可验证的新能力
title: "[建议] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述使用场景和当前痛点。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的交互、行为或输出。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明你考虑过的其他解决方式。
  - type: dropdown
    id: area
    attributes:
      label: 功能领域
      options:
        - 桌宠行为与互动
        - 渲染与动画
        - AI 与人格
        - 设置与系统集成
        - 性能与稳定性
        - 构建、发布与文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue 和 Discussions，未发现相同建议。
          required: true
        - label: 此建议不依赖权属不明或从商业作品中提取的素材。
          required: true
