name: 持续集成

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows 构建与测试
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      MSBUILDDISABLENODEREUSE: "1"
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: 还原依赖
        run: dotnet restore Honey.slnx

      - name: 构建
        run: dotnet build Honey.slnx -c Release --no-restore

      - name: 运行 .NET 测试
        run: dotnet test Honey.slnx -c Release --no-build

      - name: 运行 PowerShell 回归测试
        if: always()
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\scripts\windows-powershell-regression.tests.ps1

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: tests/**/TestResults/**
          if-no-files-found: warn
          retention-days: 14
